# TrustRail — Postgres-backed local stack (Postgres = source of truth).
# Usage:  docker compose up --build   then open http://localhost:8000/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trustrail
      POSTGRES_PASSWORD: trustrail
      POSTGRES_DB: trustrail
    ports:
      - "5432:5432"
    volumes:
      - trustrail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustrail"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://trustrail:trustrail@db:5432/trustrail
      AUTO_CREATE_TABLES: "true"   # demo convenience; use Alembic in real prod
      SEED_MERCHANT: "true"
    ports:
      - "8000:8000"

volumes:
  trustrail_pgdata:
