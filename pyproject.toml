[project]
name = "trustrail"
version = "0.1.0"
description = "TrustRail — Agentic Transaction Integrity & Recovery Engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Put the project root on sys.path so tests can `import app...`
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
# Curated rule set: pyflakes + a subset of pycodestyle + import sorting, plus
# pyupgrade, bugbear, comprehensions and Ruff-specific checks. E501 (line length)
# is intentionally left to the formatter.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "RUF"]
ignore = [
    # FastAPI's dependency injection puts Depends()/Query() in argument defaults
    # by design — it is the framework's documented idiom, not a bug.
    "B008",
]
